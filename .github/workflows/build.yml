name: Build libdave (old glibc)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install tools
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git curl zip unzip tar pkg-config gcc-13 g++-13

      - name: Get libdave source
        run: git clone --recursive https://github.com/discord/libdave.git

      - name: Bootstrap vcpkg
        working-directory: libdave/cpp/vcpkg
        run: ./bootstrap-vcpkg.sh -disableMetrics

      - name: Build
        working-directory: libdave/cpp
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build

      - name: Verify glibc requirement
        run: |
          so=$(find libdave/cpp/build -name 'libdave*.so' | head -1)
          echo "Found: $so"
          strip "$so"
          objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          ldd "$so"

      - uses: actions/upload-artifact@v4
        with:
          name: libdave
          path: libdave/cpp/build/**/libdave*.so
